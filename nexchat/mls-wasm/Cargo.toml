# EN: nexchat-mls — OpenMLS (RFC 9420) wrapper compiled to WASM for the web client.
# This crate is the ONLY place cryptography happens (mirrors plan §3.1 chat-client-core/mls).
# CN: nexchat-mls —— 把 OpenMLS(RFC 9420) 封装编译为 WASM 供网页客户端使用。
# 本 crate 是密码学唯一所在（对应方案 §3.1 chat-client-core/mls）。
#
# 独立 workspace：脱离父 substrate workspace，避免污染节点构建。
# Standalone workspace: detach from the parent substrate workspace.
[package]
name = "nexchat-mls"
version = "0.1.0"
edition = "2021"
license = "MIT-0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
# OpenMLS RFC 9420 + RustCrypto backend (wasm-friendly, pure Rust).
openmls = { version = "0.8", features = ["js"] }
openmls_rust_crypto = "0.5"
openmls_basic_credential = "0.5"
openmls_traits = "0.5"
tls_codec = { version = "0.4", features = ["derive"] }
sha2 = "0.10"
console_error_panic_hook = "0.1"
# EN: force the js backend for getrandom 0.2 on wasm32-unknown-unknown.
# CN: 在 wasm32-unknown-unknown 上为 getrandom 0.2 强制启用 js 后端。
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"

[workspace]
