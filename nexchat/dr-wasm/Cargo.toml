# EN: nexchat-dr — vodozemac (Olm / X3DH + Double Ratchet) wrapper compiled to WASM for
# the decentralized 1:1 stack. This crate is the ONLY place 1:1 cryptography happens and
# is STRICTLY decoupled from the OpenMLS group engine (`mls-wasm`): no shared types, no
# cross-imports (design §2/§3 of CHAT_1TO1_X3DH_DOUBLE_RATCHET_DESIGN.md).
# CN: nexchat-dr —— 把 vodozemac（Olm / X3DH + 双棘轮）封装编译为 WASM，供去中心化 1:1 栈使用。
# 本 crate 是 1:1 密码学唯一所在，且与 OpenMLS 群引擎（`mls-wasm`）严格解耦：无共享类型、无交叉
# import（设计 §2/§3）。
#
# 独立 workspace：脱离父 substrate workspace，避免污染节点构建。
# Standalone workspace: detach from the parent substrate workspace.
[package]
name = "nexchat-dr"
version = "0.1.0"
edition = "2021"
license = "MIT-0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# Olm / Double Ratchet, pure Rust, wasm-friendly (RustCrypto backend).
vodozemac = "0.10"
serde_json = "1"
console_error_panic_hook = "0.1"
# EN: force the js backend for getrandom on wasm32-unknown-unknown.
# CN: 在 wasm32-unknown-unknown 上为 getrandom 强制启用 js 后端。
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"

[workspace]
