# EN: Standalone nexchat-repo workflow (paths without nexchat/ prefix).
# When this directory is the repo root (nexusmalls/nexchat), GitHub Actions runs this file.
# Monorepo nexus uses /.github/workflows/nexchat-dr.yml instead.
# CN: 独立 nexchat 仓库用 workflow（路径无 nexchat/ 前缀）。本目录为仓库根时由 Actions 执行；
# nexus 单体仓请用 /.github/workflows/nexchat-dr.yml。
name: DR WASM

on:
  pull_request:
    paths:
      - "dr-wasm/**"
      - "src/crypto-dr/**"
      - "src/dr-pkg/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dr-wasm.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "dr-wasm/**"
      - "src/crypto-dr/**"
      - "src/dr-pkg/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dr-wasm.yml"

concurrency:
  group: dr-wasm-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dr-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Native dr-wasm integration tests
        run: npm run test:dr

      - name: TS crypto-dr tests (committed WASM)
        run: npm test -- src/crypto-dr/

  dr-wasm-artifact-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.122 --locked

      - name: Rebuild dr-pkg from dr-wasm sources
        run: npm run dr:build

      - name: Assert src/dr-pkg matches dr:build output
        run: |
          if ! git diff --quiet -- src/dr-pkg/; then
            echo "::error::src/dr-pkg/ is out of sync with dr-wasm sources. Run 'npm run dr:build' and commit."
            git diff --stat -- src/dr-pkg/
            exit 1
          fi
