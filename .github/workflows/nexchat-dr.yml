# EN: NexChat 1:1 Double Ratchet (dr-wasm + crypto-dr) CI gate.
# Runs native Rust smoke tests and TS integration tests against committed src/dr-pkg/.
# CN: NexChat 1:1 双棘轮（dr-wasm + crypto-dr）CI 门禁。
name: NexChat DR

on:
  pull_request:
    paths:
      - "nexchat/dr-wasm/**"
      - "nexchat/src/crypto-dr/**"
      - "nexchat/src/dr-pkg/**"
      - "nexchat/package.json"
      - "nexchat/package-lock.json"
      - ".github/workflows/nexchat-dr.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "nexchat/dr-wasm/**"
      - "nexchat/src/crypto-dr/**"
      - "nexchat/src/dr-pkg/**"
      - "nexchat/package.json"
      - "nexchat/package-lock.json"
      - ".github/workflows/nexchat-dr.yml"

concurrency:
  group: nexchat-dr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dr-wasm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexchat
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nexchat/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Native dr-wasm integration tests
        run: npm run test:dr

      - name: TS crypto-dr tests (committed WASM)
        run: npm test -- src/crypto-dr/

  dr-wasm-artifact-sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexchat
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.122 --locked

      - name: Rebuild dr-pkg from dr-wasm sources
        run: npm run dr:build

      - name: Assert src/dr-pkg matches dr:build output
        run: |
          if ! git diff --quiet -- src/dr-pkg/; then
            echo "::error::src/dr-pkg/ is out of sync with dr-wasm sources. Run 'npm run dr:build' in nexchat/ and commit."
            git diff --stat -- src/dr-pkg/
            exit 1
          fi
