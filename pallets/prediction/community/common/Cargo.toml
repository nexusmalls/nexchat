[package]
name = "pallet-prediction-community-common"
version = "0.1.0"
description = "Shared types and traits for Nexus prediction community fee commission"
license = "MIT-0"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[lib]
name = "pallet_prediction_community_common"
path = "src/lib.rs"

[dependencies]
codec = { workspace = true, features = ["derive", "max-encoded-len"] }
frame-support = { workspace = true }
scale-info = { workspace = true, features = ["derive"] }
sp-runtime = { workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-support/std",
	"scale-info/std",
	"sp-runtime/std",
]
