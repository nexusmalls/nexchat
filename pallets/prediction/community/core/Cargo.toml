[package]
name = "pallet-prediction-community-core"
version = "0.1.0"
description = "Prediction community fee commission: MultiLevel, SingleLine, pool, withdraw/reinvest (P0.5–P5)"
license = "MIT-0"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[lib]
name = "pallet_prediction_community_core"
path = "src/lib.rs"

[dependencies]
codec = { workspace = true, features = ["derive", "max-encoded-len"] }
frame-benchmarking = { workspace = true, optional = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
orml-traits = { workspace = true }
pallet-prediction-community-common = { workspace = true }
scale-info = { workspace = true, features = ["derive"] }
sp-runtime = { workspace = true }
zeitgeist-primitives = { workspace = true }

[dev-dependencies]
orml-currencies = { workspace = true, features = ["std"] }
orml-tokens = { workspace = true, features = ["std"] }
pallet-balances = { workspace = true, features = ["std"] }
sp-io = { workspace = true, features = ["std"] }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-benchmarking?/std",
	"frame-support/std",
	"frame-system/std",
	"orml-traits/std",
	"pallet-prediction-community-common/std",
	"scale-info/std",
	"sp-runtime/std",
	"zeitgeist-primitives/std",
]
runtime-benchmarks = [
	"dep:frame-benchmarking",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"zeitgeist-primitives/runtime-benchmarks",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
]
