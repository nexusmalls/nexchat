[package]
name = "prediction-differential"
version = "0.1.0"
description = "Behavioral differential baseline harness for the Nexus prediction port"
license = "MIT-0"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
zeitgeist-primitives = { workspace = true }

[dev-dependencies]
frame-support = { workspace = true, features = ["std"] }
frame-system = { workspace = true, features = ["std"] }
orml-traits = { workspace = true, features = ["std"] }
sp-arithmetic = { workspace = true, features = ["std"] }
sp-io = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }
zeitgeist-primitives = { workspace = true, features = ["mock", "std"] }
zrml-authorized = { workspace = true, features = ["std"] }
zrml-combinatorial-tokens = { workspace = true, features = ["mock", "std"] }
zrml-court = { workspace = true, features = ["std"] }
zrml-global-disputes = { workspace = true, features = ["std"] }
zrml-market-commons = { workspace = true, features = ["std"] }
zrml-orderbook = { workspace = true, features = ["mock", "std"] }
zrml-parimutuel = { workspace = true, features = ["mock", "std"] }
zrml-prediction-markets = { workspace = true, features = ["mock", "std"] }

[features]
default = ["std"]
std = [
    "zeitgeist-primitives/std",
]
