[package]
name = "pallet-prediction-collateral"
version = "0.1.0"
description = "Safe pallet-assets to ORML collateral mirror for Nexus prediction markets"
license = "MIT-0"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[lib]
name = "pallet_prediction_collateral"
path = "src/lib.rs"

[dependencies]
codec = { workspace = true, features = ["derive", "max-encoded-len"] }
frame-benchmarking = { workspace = true, optional = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
orml-traits = { workspace = true }
pallet-prediction-control = { workspace = true }
scale-info = { workspace = true, features = ["derive"] }
sp-runtime = { workspace = true }
zeitgeist-primitives = { workspace = true }

[dev-dependencies]
orml-currencies = { workspace = true, features = ["std"] }
orml-tokens = { workspace = true, features = ["std"] }
pallet-assets = { workspace = true, features = ["std"] }
pallet-balances = { workspace = true, features = ["std"] }
proptest = { workspace = true }
sp-io = { workspace = true, features = ["std"] }

[features]
default = ["std"]
std = [
    "codec/std",
    "frame-benchmarking?/std",
    "frame-support/std",
    "frame-system/std",
    "orml-traits/std",
    "pallet-prediction-control/std",
    "scale-info/std",
    "sp-runtime/std",
    "zeitgeist-primitives/std",
]
runtime-benchmarks = [
    "dep:frame-benchmarking",
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "pallet-prediction-control/runtime-benchmarks",
    "zeitgeist-primitives/runtime-benchmarks",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
    "pallet-prediction-control/try-runtime",
]
